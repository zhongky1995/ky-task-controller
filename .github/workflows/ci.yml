name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest
      - name: Validate Python and JavaScript syntax
        run: |
          python -m compileall -q plugins/task-controller
          node --check plugins/task-controller/mcp/server.mjs
      - name: Run tests
        working-directory: plugins/task-controller
        run: python -m pytest -q
