interface:
  display_name: "KY-TASK"
  short_description: "按 lane / worker 管理复杂任务执行"
  default_prompt: "用 KY-TASK 建立或读取任务契约，先按实际工作拆分 lanes，再严格编排 semantic owner、主路径、并行波次、串行原因、join points 与逐 lane 能力匹配；编排通过后才选择项目内 Session、记录 checkpoint，并在外部写入前确认写入边界。不要套固定五段模板。"
policy:
  allow_implicit_invocation: true
